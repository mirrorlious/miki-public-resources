name: Migrate Miki public resources

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - .migration-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy and validate public Miki resources
        run: python scripts/migrate_public_resources.py

      - name: Commit migrated resources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .migration-trigger
          rm -f .github/workflows/migrate-from-reader.yml
          rm -f scripts/migrate_public_resources.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "data: migrate public Miki resources without DYL"
          git push origin HEAD:main
