name: Migrate Miki public resources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .migration-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy and validate Miki resources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/miki-reader-source
          git clone --depth=1 https://github.com/mirrorlious/-.git /tmp/miki-reader-source

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path

          source = Path('/tmp/miki-reader-source')
          target = Path('.')
          source_resources = source / 'public-resources'
          target_resources = target / 'public-resources'

          if not source_resources.is_dir():
              raise SystemExit('source public-resources directory is missing')

          if target_resources.exists():
              shutil.rmtree(target_resources)
          shutil.copytree(source_resources, target_resources)

          pack_markers = (
              'public-resources/',
              'dyl-exam-public-backup',
              'politics-2027',
              'pharmacology-xmind-anki',
              'jlpt-eggrolls',
              'kaoyan-english-one-papers',
              'kaoyan-english-two-papers',
              'kaoyan-english-2027-vocabulary',
          )
          copied_support_files: list[str] = []
          scanned_roots = ('scripts', 'tools', '.github/workflows')
          for root_name in scanned_roots:
              root = source / root_name
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  relative = path.relative_to(source)
                  haystack = f'{relative.as_posix()}\n{text}'.lower()
                  if not any(marker.lower() in haystack for marker in pack_markers):
                      continue
                  destination = target / relative
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path, destination)
                  copied_support_files.append(relative.as_posix())

          manifest_path = target_resources / 'manifest.json'
          catalog = json.loads(manifest_path.read_text(encoding='utf-8'))
          serialized = json.dumps(catalog, ensure_ascii=False, indent=2)
          serialized = serialized.replace(
              'https://cdn.jsdelivr.net/gh/mirrorlious/-@main/public-resources/',
              'https://cdn.jsdelivr.net/gh/mirrorlious/miki-public-resources@main/public-resources/',
          ).replace(
              'https://raw.githubusercontent.com/mirrorlious/-/main/public-resources/',
              'https://raw.githubusercontent.com/mirrorlious/miki-public-resources/main/public-resources/',
          )
          manifest_path.write_text(serialized + '\n', encoding='utf-8')

          old_repo_tokens = (
              'raw.githubusercontent.com/mirrorlious/-/',
              'cdn.jsdelivr.net/gh/mirrorlious/-@',
          )

          def require_file(path: Path, label: str) -> None:
              if not path.is_file():
                  raise SystemExit(f'missing {label}: {path.as_posix()}')
              if path.stat().st_size == 0:
                  raise SystemExit(f'empty {label}: {path.as_posix()}')

          require_file(manifest_path, 'catalog')
          catalog = json.loads(manifest_path.read_text(encoding='utf-8'))
          checked_paths: set[Path] = {manifest_path}
          for pack in catalog.get('packs', []):
              for field in ('manifestUrl', 'dataUrl', 'sourceUrl'):
                  value = pack.get(field)
                  if not isinstance(value, str) or not value:
                      continue
                  if value.startswith('http://') or value.startswith('https://'):
                      if any(token in value for token in old_repo_tokens):
                          raise SystemExit(f'old repository URL remains in catalog: {value}')
                      continue
                  path = target_resources / value
                  require_file(path, f'{pack.get("id", "pack")} {field}')
                  checked_paths.add(path)

              manifest_url = pack.get('manifestUrl')
              if not isinstance(manifest_url, str) or not manifest_url:
                  continue
              if manifest_url.startswith('http://') or manifest_url.startswith('https://'):
                  relative_manifest = Path('dyl-exam-public-backup/manifest.json') if pack.get('id') == 'dyl-exam-public-backup' else None
              else:
                  relative_manifest = Path(manifest_url)
              if relative_manifest is None:
                  continue
              pack_manifest_path = target_resources / relative_manifest
              require_file(pack_manifest_path, f'{pack.get("id")} manifest')
              checked_paths.add(pack_manifest_path)
              pack_manifest = json.loads(pack_manifest_path.read_text(encoding='utf-8'))
              base = pack_manifest_path.parent
              files = pack_manifest.get('files') or {}
              for key in ('bundle', 'data', 'attribution'):
                  value = files.get(key)
                  if isinstance(value, str) and value:
                      path = base / value
                      require_file(path, f'{pack.get("id")} {key}')
                      checked_paths.add(path)
              for key in ('bundleParts', 'cards'):
                  values = files.get(key)
                  if isinstance(values, list):
                      for value in values:
                          path = base / value
                          require_file(path, f'{pack.get("id")} {key}')
                          checked_paths.add(path)

          all_resource_files = sorted(p for p in target_resources.rglob('*') if p.is_file())
          source_files = sorted(p for p in source_resources.rglob('*') if p.is_file())
          if len(all_resource_files) != len(source_files):
              raise SystemExit(
                  f'resource file count mismatch: source={len(source_files)} target={len(all_resource_files)}'
              )

          digest_rows = []
          for path in all_resource_files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              digest_rows.append((path.relative_to(target).as_posix(), path.stat().st_size, digest))

          source_commit = subprocess.check_output(
              ['git', '-C', str(source), 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          audit_lines = [
              '# Miki public-resource migration audit',
              '',
              '- Source repository: `mirrorlious/-`',
              f'- Source commit: `{source_commit}`',
              f'- Resource files copied: **{len(all_resource_files)}**',
              f'- Support files copied: **{len(copied_support_files)}**',
              f'- Referenced files validated: **{len(checked_paths)}**',
              '',
              '## Copied support files',
              '',
          ]
          audit_lines.extend(f'- `{path}`' for path in copied_support_files)
          audit_lines.extend([
              '',
              '## Resource checksums',
              '',
              '| File | Bytes | SHA-256 |',
              '|---|---:|---|',
          ])
          audit_lines.extend(f'| `{path}` | {size} | `{digest}` |' for path, size, digest in digest_rows)
          (target / 'MIGRATION_AUDIT.md').write_text('\n'.join(audit_lines) + '\n', encoding='utf-8')

          agents = '''# Miki public-resource repository rules

- This repository contains only publicly distributable resources and build tools for 【杨】Miki.
- Keep runtime catalog files under `public-resources/`.
- Preserve attribution, license and source-commit information for every imported pack.
- Never store user data, credentials, tokens, Firebase service accounts, CloudBase SecretId/SecretKey, or private asset packs here.
- DYL and ZH2000 primary large asset packs remain in Tencent CloudBase storage; this repository may contain only an explicitly approved public fallback pack.
- Changes to pack paths or IDs must remain backward compatible with installed Miki profiles.
'''
          (target / 'AGENTS.md').write_text(agents, encoding='utf-8')
          PY

      - name: Commit migrated resources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .migration-trigger .github/workflows/migrate-from-reader.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "data: migrate Miki public resources from reader repository"
          git push origin HEAD:main
