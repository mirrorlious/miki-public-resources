name: QY v2 catalog cutover gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'public-resources/manifest.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate proposed QY catalog entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          payload = json.loads(Path('public-resources/manifest.json').read_text(encoding='utf-8'))
          qy = next(pack for pack in payload['packs'] if str(pack.get('packId') or pack.get('id')) == 'qy-lsat-civil-law')
          url = qy['manifestUrl']
          assert payload.get('updatedAt') == '2026-08-07'
          assert qy.get('version') == '2026.08.07.2'
          assert qy.get('resourceVersion') == 'qy-6de77921b97ff4a9-8694616'
          assert qy.get('manifestSchemaVersion') == 2
          assert re.search(r'/[0-9a-f]{40}/', url)
          assert 'c0489c560499a572357c0a478b12f6235d30b323' in url
          assert '/main/' not in url and '/master/' not in url
          assert url.endswith('/manifest.v2.json')
          print('QY_CATALOG_PROPOSAL_VALID=true')
          PY

      - name: Verify immutable Manifest v2 and resources remotely
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request

          manifest_url = 'https://raw.githubusercontent.com/mirrorlious/miki-public-resources/c0489c560499a572357c0a478b12f6235d30b323/public-resources/qy-lsat-civil-law/releases/2026.08.07.2-qy-6de77921b97ff4a9-8694616/manifest.v2.json'
          with urllib.request.urlopen(manifest_url, timeout=30) as response:
              manifest = json.loads(response.read().decode('utf-8'))
          assert manifest['schemaVersion'] == 2
          assert manifest['version'] == '2026.08.07.2'
          assert manifest['resourceVersion'] == 'qy-6de77921b97ff4a9-8694616'
          assert manifest['runtime']['compatibilityProfile']['version'] == 3
          for resource in manifest['resources']:
              url = urllib.parse.urljoin(manifest_url, resource['path'])
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload = response.read()
              assert len(payload) == resource['sizeBytes'], resource['path']
              assert hashlib.sha256(payload).hexdigest() == resource['integrity']['digest'], resource['path']
          print('QY_IMMUTABLE_RELEASE_REMOTE_VALID=true')
          PY

      - name: Verify miki-cn production has QY profile v3 runtime
        shell: bash
        run: |
          python - <<'PY'
          import re
          import time
          import urllib.parse
          import urllib.request

          origin = 'https://miki-cn.pages.dev'
          required_model = b'2207398801'
          release_markers = [b'qy-6de77921b97ff4a9-8694616', b'c0489c560499a572357c0a478b12f6235d30b323']

          def fetch(url):
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Miki-QY-v2-PR-gate/1.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read(), response.geturl()

          last = None
          for attempt in range(18):
              html, final_url = fetch(f'{origin}/?qy_v2_pr_gate={int(time.time())}')
              text = html.decode('utf-8', 'ignore')
              queue = [urllib.parse.urljoin(final_url, ref) for ref in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''', text)]
              seen = set()
              corpus = bytearray(html)
              while queue and len(seen) < 100:
                  url = queue.pop()
                  if url in seen:
                      continue
                  seen.add(url)
                  try:
                      payload, resolved = fetch(url)
                  except Exception:
                      continue
                  corpus.extend(payload)
                  for asset in re.findall(rb'assets/[A-Za-z0-9_.-]+\.js', payload):
                      queue.append(urllib.parse.urljoin(resolved, asset.decode('ascii')))
              model_ok = required_model in corpus
              release_ok = any(marker in corpus for marker in release_markers)
              last = {'attempt': attempt + 1, 'assets': len(seen), 'model': model_ok, 'release': release_ok}
              print('QY_MIKI_CN_PROBE', last, flush=True)
              if model_ok and release_ok:
                  print('QY_MIKI_CN_PROFILE_V3_READY=true')
                  break
              time.sleep(10)
          else:
              raise SystemExit(f'miki-cn production does not yet expose the verified QY v2 runtime: {last}')
          PY
