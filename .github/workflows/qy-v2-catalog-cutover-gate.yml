name: QY frozen catalog invariant gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'public-resources/manifest.json'

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frozen QY catalog entry
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          payload = json.loads(Path('public-resources/manifest.json').read_text(encoding='utf-8'))
          qy = next(pack for pack in payload['packs'] if str(pack.get('packId') or pack.get('id')) == 'qy-lsat-civil-law')
          url = qy['manifestUrl']
          assert qy.get('version') == '2026.08.07.1'
          assert qy.get('cardCount') == 539
          assert qy.get('deckCount') == 92
          assert qy.get('noteCount') == 539
          assert re.search(r'/[0-9a-f]{40}/', url)
          assert 'ea044d37af43ee407f97693f963c691a41d65ee2' in url
          assert '/main/' not in url and '/master/' not in url
          assert url.endswith('/public-resources/qy-lsat-civil-law/manifest.json')
          print('QY_FROZEN_CATALOG_VALID=true')
          PY

      - name: Verify frozen QY manifest remotely
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request

          manifest_url = 'https://raw.githubusercontent.com/mirrorlious/miki-public-resources/ea044d37af43ee407f97693f963c691a41d65ee2/public-resources/qy-lsat-civil-law/manifest.json'
          with urllib.request.urlopen(manifest_url, timeout=30) as response:
              manifest = json.loads(response.read().decode('utf-8'))

          assert manifest['schemaVersion'] == 1
          assert manifest['version'] == '2026.08.07.1'
          assert manifest['cardCount'] == 539
          assert manifest['deckCount'] == 92
          assert manifest['noteCount'] == 539

          apkg_url = manifest['files']['apkg']
          assert re.search(r'/[0-9a-f]{40}/', apkg_url)
          assert '/main/' not in apkg_url and '/master/' not in apkg_url
          assert apkg_url.endswith('.apkg')
          print('QY_FROZEN_MANIFEST_REMOTE_VALID=true')
          PY
