name: Cleanup reader-only migration files

on:
  push:
    branches:
      - main
    paths:
      - .cleanup-reader-only-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/cleanup_reader_only_files.py
      - name: Commit cleanup
        run: |
          set -euo pipefail
          rm -f .cleanup-reader-only-trigger
          rm -f .github/workflows/cleanup-reader-only-files.yml
          rm -f scripts/cleanup_reader_only_files.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: remove reader-only files from Miki resources"
          git push origin HEAD:main
