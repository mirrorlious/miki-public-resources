name: Repair QY civil law public pack

on:
  push:
    paths:
      - .tmp-qy-civil-law-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download trusted inputs
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/qy-builder.py \
            'https://raw.githubusercontent.com/mirrorlious/miki-public-resources/923b35bb0d2e561b1786e71e9a9dcdb7186f9813/scripts/.tmp-build-qy-civil-law.py'
          curl --fail --location --retry 3 \
            --output source.apkg \
            'https://raw.githubusercontent.com/mirrorlious/ankicardsfo1po/main/QY%E6%B0%91%E6%B3%95%E6%B3%95%E7%A1%95Anki%E8%AE%B0%E5%BF%86%E5%8D%A1%E7%89%87.apkg'

      - name: Rebuild single-file bundle
        run: |
          rm -rf public-resources/qy-lsat-civil-law extract
          python /tmp/qy-builder.py
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('public-resources')
          pack_dir = root / 'qy-lsat-civil-law'
          bundle_path = pack_dir / 'pack.json.gz.b64'
          manifest_path = pack_dir / 'manifest.json'
          catalog_path = root / 'manifest.json'

          encoded = ''.join(bundle_path.read_text(encoding='ascii').split())
          assert encoded and len(encoded) % 4 == 0
          assert re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', encoded)
          compressed = base64.b64decode(encoded, validate=True)
          bundle = json.loads(gzip.decompress(compressed))
          cards = bundle['cards']
          decks = bundle['data']['decks']

          assert len(cards) == 539
          assert len(decks) == 92
          assert len({card['id'] for card in cards}) == 539
          assert len({card['sourceKey'] for card in cards}) == 539

          unsafe = re.compile(r'<script\b|\son[a-z]+\s*=|javascript\s*:', re.I)
          assert not any(
              unsafe.search('\n'.join(str(card.get(key, '')) for key in ('frontHtml', 'backHtml', 'cardCss')))
              for card in cards
          )

          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '2026.08.04.1'
          manifest['cardCount'] = 539
          manifest['deckCount'] = 92
          manifest['noteCount'] = 539
          manifest['mapCount'] = 7
          manifest['duplicateCountRemoved'] = 6
          manifest['files'] = {
              'bundle': 'pack.json.gz.b64',
              'knowledgeMap': 'knowledge-map.html',
              'attribution': 'ATTRIBUTION.md',
          }
          manifest['integrity'] = {
              'encoding': 'base64+gzip+json',
              'encodedSha256': hashlib.sha256(encoded.encode('ascii')).hexdigest(),
              'compressedSha256': hashlib.sha256(compressed).hexdigest(),
          }
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          found = False
          for item in catalog.get('packs', []):
              if item.get('packId', item.get('id')) == 'qy-lsat-civil-law':
                  for key in ('version', 'cardCount', 'deckCount', 'noteCount', 'mapCount'):
                      item[key] = manifest[key]
                  item['manifestUrl'] = 'qy-lsat-civil-law/manifest.json'
                  found = True
          assert found
          catalog['updatedAt'] = '2026-08-04'
          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          assert not list(pack_dir.glob('pack.part-*.b64'))
          assert not list(pack_dir.glob('pack.tail-*.b64'))
          print(json.dumps({
              'encodedLength': len(encoded),
              'compressedBytes': len(compressed),
              'cards': len(cards),
              'decks': len(decks),
              'maps': manifest['mapCount'],
              'version': manifest['version'],
          }, ensure_ascii=False))
          PY
          git diff --check

      - name: Commit verified repair and remove one-shot files
        run: |
          rm -rf source.apkg extract
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- public-resources
          git rm -f --ignore-unmatch \
            .tmp-qy-civil-law-repair \
            .github/workflows/qy-civil-law-repair.yml
          git commit -m 'fix: rebuild QY civil law pack as verified single bundle'
          git push origin HEAD:main
