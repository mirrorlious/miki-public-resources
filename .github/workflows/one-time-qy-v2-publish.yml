name: One-time QY v2 immutable release publisher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-qy-v2-publish.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: mirrorlious/ankicardsfo1po
          ref: e7d440f888ec78ef97f19d8229d398e58cba67ee
          path: .qy-source

      - name: Materialize immutable release from pinned source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import mimetypes
          import shutil
          import zipfile
          from pathlib import Path

          spec_path = Path('.release-tmp/qy-v2-2026.08.07.2.json')
          spec = json.loads(spec_path.read_text(encoding='utf-8'))
          release_root = Path(spec['releasePath'])
          if release_root.exists():
              raise SystemExit(f'Immutable release path already exists: {release_root}')

          source = spec['source']
          source_path = Path('.qy-source') / source['path']
          source_bytes = source_path.read_bytes()
          source_digest = hashlib.sha256(source_bytes).hexdigest()
          if len(source_bytes) != source['sizeBytes'] or source_digest != source['sha256']:
              raise SystemExit('Pinned QY source byte identity does not match the verified release spec.')

          release_root.mkdir(parents=True, exist_ok=False)
          packages_dir = release_root / 'packages'
          media_dir = release_root / 'media'
          packages_dir.mkdir()
          media_dir.mkdir()

          manifest = spec['manifest']
          media_index = spec['mediaIndex']
          apkg_resource = next(resource for resource in manifest['resources'] if resource['role'] == 'apkg')
          apkg_target = release_root / apkg_resource['path']
          shutil.copyfile(source_path, apkg_target)

          expected_media = {entry['filename']: entry for entry in media_index['entries']}
          seen = {}
          source_media_count = 0
          with zipfile.ZipFile(source_path) as archive:
              media_map = json.loads(archive.read('media').decode('utf-8'))
              source_media_count = len(media_map)
              for archive_name, filename in media_map.items():
                  filename = str(filename)
                  payload = archive.read(str(archive_name))
                  digest = hashlib.sha256(payload).hexdigest()
                  prior = seen.get(filename)
                  if prior is not None:
                      if prior != digest:
                          raise SystemExit(f'Conflicting duplicate media filename: {filename}')
                      continue
                  seen[filename] = digest
                  expected = expected_media.get(filename)
                  if not expected:
                      raise SystemExit(f'Unexpected media filename in pinned APKG: {filename}')
                  if len(payload) != expected['sizeBytes'] or digest != expected['sha256']:
                      raise SystemExit(f'Media identity mismatch: {filename}')
                  media_path = release_root / expected['path']
                  media_path.parent.mkdir(parents=True, exist_ok=True)
                  media_path.write_bytes(payload)

          if source_media_count != media_index['sourceMediaEntryCount']:
              raise SystemExit('Source media entry count mismatch.')
          if len(seen) != media_index['uniqueMediaCount']:
              raise SystemExit('Unique media count mismatch.')
          if source_media_count - len(seen) != media_index['duplicateMediaEntryCount']:
              raise SystemExit('Duplicate media count mismatch.')
          if set(seen) != set(expected_media):
              raise SystemExit('Published media filename set does not match verified media index.')
          if media_index['conflictingMediaCount'] != 0:
              raise SystemExit('Release spec unexpectedly declares conflicting media.')

          media_index_text = json.dumps(media_index, ensure_ascii=False, indent=2)
          media_index_bytes = media_index_text.encode('utf-8')
          media_index_resource = next(resource for resource in manifest['resources'] if resource['role'] == 'media-index')
          if len(media_index_bytes) != media_index_resource['sizeBytes']:
              raise SystemExit('media/index.json byte length differs from manifest declaration.')
          if hashlib.sha256(media_index_bytes).hexdigest() != media_index_resource['integrity']['digest']:
              raise SystemExit('media/index.json digest differs from manifest declaration.')
          (release_root / media_index_resource['path']).write_bytes(media_index_bytes)

          for resource in manifest['resources']:
              target = release_root / resource['path']
              payload = target.read_bytes()
              digest = hashlib.sha256(payload).hexdigest()
              if len(payload) != resource['sizeBytes'] or digest != resource['integrity']['digest']:
                  raise SystemExit(f'Final release resource mismatch: {resource["path"]}')

          (release_root / 'manifest.v2.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (release_root / 'SOURCE.json').write_text(
              json.dumps({
                  'packId': manifest['packId'],
                  'version': manifest['version'],
                  'resourceVersion': manifest['resourceVersion'],
                  'sourceRepository': source['repository'],
                  'sourceCommit': source['commit'],
                  'sourcePath': source['path'],
                  'sourceSizeBytes': source['sizeBytes'],
                  'sourceSha256': source['sha256'],
                  'author': 'QY',
                  'license': '仅供个人学习',
              }, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          (release_root / 'ATTRIBUTION.md').write_text(
              '# QY 民法法硕 Anki 记忆卡片\n\n'
              '- Author: QY\n'
              '- License: 仅供个人学习\n'
              f'- Source repository: `{source["repository"]}`\n'
              f'- Source commit: `{source["commit"]}`\n'
              f'- Source path: `{source["path"]}`\n',
              encoding='utf-8',
          )
          PY

      - name: Commit immutable release content
        id: release_commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public-resources/qy-lsat-civil-law/releases/2026.08.07.2-qy-6de77921b97ff4a9-8694616
          git commit -m 'release(qy): publish immutable 2026.08.07.2 resources'
          release_sha="$(git rev-parse HEAD)"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          echo "QY_RELEASE_CONTENT_COMMIT=$release_sha"

      - name: Verify every resource through commit-pinned raw GitHub
        env:
          RELEASE_SHA: ${{ steps.release_commit.outputs.release_sha }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request
          from pathlib import Path

          spec = json.loads(Path('.release-tmp/qy-v2-2026.08.07.2.json').read_text(encoding='utf-8'))
          manifest = spec['manifest']
          release_sha = os.environ['RELEASE_SHA']
          release_path = spec['releasePath']
          base = f'https://raw.githubusercontent.com/mirrorlious/miki-public-resources/{release_sha}/{release_path}/'

          def fetch(relative_path):
              last_error = None
              for attempt in range(10):
                  try:
                      with urllib.request.urlopen(base + relative_path, timeout=30) as response:
                          return response.read()
                  except Exception as error:
                      last_error = error
                      time.sleep(2 + attempt)
              raise last_error

          remote_manifest = json.loads(fetch('manifest.v2.json').decode('utf-8'))
          if remote_manifest != manifest:
              raise SystemExit('Remote manifest differs from verified release spec.')

          verified = []
          for resource in manifest['resources']:
              payload = fetch(resource['path'])
              digest = hashlib.sha256(payload).hexdigest()
              if len(payload) != resource['sizeBytes'] or digest != resource['integrity']['digest']:
                  raise SystemExit(f'Remote integrity mismatch: {resource["path"]}')
              verified.append({
                  'path': resource['path'],
                  'sizeBytes': len(payload),
                  'sha256': digest,
              })
          print('QY_REMOTE_VERIFICATION=' + json.dumps({
              'releaseContentCommit': release_sha,
              'manifestUrl': base + 'manifest.v2.json',
              'resourceCount': len(verified),
              'verified': verified,
              'passed': True,
          }, separators=(',', ':')))
          PY

      - name: Remove one-time publication controls
        shell: bash
        run: |
          git pull --ff-only origin main
          git rm .github/workflows/one-time-qy-v2-publish.yml .release-tmp/qy-v2-2026.08.07.2.json
          git commit -m 'ci: remove one-time QY v2 publication controls'
          git push origin HEAD:main
